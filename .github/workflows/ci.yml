name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Not the vanilla postgres image — this app's migrations create
        # `vector` columns (lesson-artifact embeddings, S3) and rely on
        # pg_trgm (admin search). Local dev already uses this exact image
        # (docker-compose.yml); the plain postgres:16 image has neither
        # extension available, so every migration touching those columns
        # would fail here otherwise.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lms_test
      DB_USERNAME: lms
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, mbstring, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Enable required Postgres extensions
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U lms -d lms_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h 127.0.0.1 -U lms -d lms_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run isolation suite and full test suite
        run: composer test
